<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Advertiser Portal">
	<!--
	A favicon has no CSS context to inherit from, so currentColor resolves to
	black and the mark disappears against dark browser chrome. The media query
	lives inside the document instead, which is the one place a favicon can
	still answer the question.
	-->
	<style>
		path { fill: #111214; }
		@media (prefers-color-scheme: dark) {
			path { fill: #f0f0f1; }
		}
	</style>
	<path d="M4.33 20.63H0L10.58 3.37h4.41zm19.67 0h-3.88L12.78 8.16h3.67zm-7.82-3.12 1.92 3.12H6.31l4.7-7.81h3.23l-2.66 4.69z"/>
</svg>
