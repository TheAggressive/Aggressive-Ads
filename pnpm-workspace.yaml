# pnpm 11 blocks dependency build scripts unless they are listed here.
#
# Keeping the list explicit means a new transitive dependency cannot silently
# run arbitrary code at install time — adding one is a reviewable change.
#
packages: []

# WordPress tooling occasionally pins vulnerable transitive releases after a
# patched version exists. Keep overrides narrow to the parent that introduces
# each advisory, then remove them when upstream moves. Every override is
# exercised by build, lint, and Playwright in ci:verify.
overrides:
  'markdownlint-cli>minimatch': 3.1.4
  'copy-webpack-plugin>serialize-javascript': 7.0.5
  'markdown-it>linkify-it': 5.0.2
  'markdownlint>markdown-it': 15.0.0
  '@wordpress/e2e-test-utils-playwright>lighthouse': 13.4.1
  'sockjs>uuid': 11.1.1
  '@sentry/node>@opentelemetry/core': 2.8.0
  eslint: 9.39.5

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  core-js-pure: false
  unrs-resolver: false

patchedDependencies:
  adm-zip@0.5.18: patches/adm-zip@0.5.18.patch

auditConfig:
  ignoreGhsas:
    - GHSA-xcpc-8h2w-3j85

# Any dependency override MUST live here, not in package.json's
# `pnpm.overrides`: with a pnpm-workspace.yaml present, pnpm 10+ reads
# overrides from this file and silently ignores the package.json field.
