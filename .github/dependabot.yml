# Dependency updates are grouped, cooled down, and limited to non-major
# releases so the guarded auto-merge workflow can handle routine maintenance
# without turning dependency churn into product releases.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github_actions
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      actions:
        patterns: ['*']

  # Dev tooling only — the plugin has no runtime Composer dependencies and
  # vendor/ never ships. Security updates remain exempt from the schedule.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - php
    ignore:
      # Tooling majors are reviewed deliberately. Security updates still arrive.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      php-tooling:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - javascript
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      wordpress:
        patterns: ['@wordpress/*']
        update-types: [minor, patch]
      js-tooling:
        patterns: ['*']
        exclude-patterns: ['@wordpress/*']
        update-types: [minor, patch]
