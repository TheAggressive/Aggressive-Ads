name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish accepted CI artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate release tag and source version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must be strict vMAJOR.MINOR.PATCH versions." >&2
            exit 1
          fi
          HEADER_VERSION="$(grep -m1 -oE '^\s*\*\s*Version:\s*\S+' aggressive-ads.php | awk '{print $NF}')"
          CONSTANT_VERSION="$(grep -m1 -oE "define\( 'AGGR_VERSION', '[^']+'" aggressive-ads.php | awk -F"'" '{print $4}')"
          PACKAGE_VERSION="$(php -r '$data = json_decode(file_get_contents("package.json"), true, flags: JSON_THROW_ON_ERROR); echo $data["version"];')"
          if [[ "${HEADER_VERSION}" != "${VERSION}" || "${CONSTANT_VERSION}" != "${VERSION}" || "${PACKAGE_VERSION}" != "${VERSION}" ]]; then
            echo "Tag ${RELEASE_TAG} must match the header (${HEADER_VERSION}), constant (${CONSTANT_VERSION}), and package (${PACKAGE_VERSION})." >&2
            exit 1
          fi
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/master || {
            echo "Release commit is not on master." >&2
            exit 1
          }

      - name: Resolve successful CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=master&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          if [[ ! "${RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "No successful master CI run exists for ${GITHUB_SHA}; refusing to release." >&2
            exit 1
          fi
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      # The package accepted by CI is the package published. Rebuilding here
      # would create different ZIP bytes and sever that evidence chain.
      - name: Download accepted plugin package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-package
          path: release/
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloaded package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash bin/release/verify-package.sh "${RELEASE_VERSION#v}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

      - name: Reconcile private draft, verify remote bytes, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash bin/release/publish.sh
