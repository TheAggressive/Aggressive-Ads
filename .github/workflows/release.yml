name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.34.1
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate release tag and plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must be strict vMAJOR.MINOR.PATCH versions." >&2
            exit 1
          fi
          HEADER_VERSION="$(grep -m1 -oE '^\s*\*\s*Version:\s*\S+' laao-advertiser-portal.php | awk '{print $NF}')"
          CONSTANT_VERSION="$(grep -m1 -oE "define\( 'LAAO_ADS_VERSION', '[^']+'" laao-advertiser-portal.php | awk -F"'" '{print $4}')"
          PACKAGE_VERSION="$(php -r '$data = json_decode(file_get_contents("package.json"), true, flags: JSON_THROW_ON_ERROR); echo $data["version"];')"
          if [[ "${HEADER_VERSION}" != "${VERSION}" || "${CONSTANT_VERSION}" != "${VERSION}" || "${PACKAGE_VERSION}" != "${VERSION}" ]]; then
            echo "Tag ${RELEASE_TAG} must match the header (${HEADER_VERSION}), constant (${CONSTANT_VERSION}), and package (${PACKAGE_VERSION})." >&2
            exit 1
          fi
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/master || {
            echo "Release commit is not on master." >&2
            exit 1
          }

      - name: Build and verify distributable
        run: |
          bash bin/release/package.sh
          bash bin/release/verify-package.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*.zip

      - name: Reconcile a private draft, verify remote bytes, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash bin/release/publish.sh
