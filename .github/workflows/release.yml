name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate release tag and plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must be strict vMAJOR.MINOR.PATCH versions." >&2
            exit 1
          fi
          HEADER_VERSION="$(grep -m1 -oE '^\s*\*\s*Version:\s*\S+' aggressive-ads.php | awk '{print $NF}')"
          CONSTANT_VERSION="$(grep -m1 -oE "define\( 'AGGR_VERSION', '[^']+'" aggressive-ads.php | awk -F"'" '{print $4}')"
          PACKAGE_VERSION="$(php -r '$data = json_decode(file_get_contents("package.json"), true, flags: JSON_THROW_ON_ERROR); echo $data["version"];')"
          if [[ "${HEADER_VERSION}" != "${VERSION}" || "${CONSTANT_VERSION}" != "${VERSION}" || "${PACKAGE_VERSION}" != "${VERSION}" ]]; then
            echo "Tag ${RELEASE_TAG} must match the header (${HEADER_VERSION}), constant (${CONSTANT_VERSION}), and package (${PACKAGE_VERSION})." >&2
            exit 1
          fi
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/master || {
            echo "Release commit is not on master." >&2
            exit 1
          }

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Build and verify distributable
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          bash bin/release/package.sh
          bash bin/release/verify-package.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

      - name: Reconcile a private draft, verify remote bytes, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash bin/release/publish.sh
