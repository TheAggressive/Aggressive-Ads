# Canonical CI/CD quality pipeline. Every executable lane maps to a committed
# package.json ci:* command and bin/ci/verify.sh mirrors the same contract.
name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.18.1'
  PHP_VERSION: '8.4'

jobs:
  # semantic-release verifies push permission even in dry-run mode. Keep that
  # write-capable token isolated from build and test jobs, and plan only from a
  # trusted push to master.
  release-plan:
    name: Plan Release
    runs-on: ubuntu-24.04
    # workflow_dispatch on master is the recovery path for a release that was
    # missed — nothing writes back to master, so an ordinary push publishes on
    # its own run. See docs/build-and-release.md.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      release_type: ${{ steps.check.outputs.release_type }}
      next_version: ${{ steps.check.outputs.next_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Lifecycle scripts are not needed for release analysis and must not run
      # while this job holds its scoped write token.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Determine release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        run: node bin/release/plan.mjs

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:doctor
      - run: pnpm ci:security

  structure:
    name: Repository Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:doctor
      - run: pnpm composer:verify
      - run: pnpm lint:files

  i18n:
    name: Translations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Installed explicitly rather than left to the runner image: catalog
      # validation must fail closed on a broken .po, and it can only do that
      # if msgfmt is present for a reason instead of by luck.
      - name: Install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext
      - run: pnpm ci:i18n

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:doctor
      - run: pnpm ci:frontend

  php:
    name: PHP Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # dist/ is gitignored, so a bare checkout has no bundles — and PHPStan
    # resolves the `require dist/admin/*.asset.php` each admin screen performs.
    # Without them it reports five require.fileNotFound errors that no local run
    # can reproduce, because a working copy always has a build in it.
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: pnpm ci:php

  coverage:
    name: PHP Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          tools: composer:v2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:coverage

  wordpress:
    name: WordPress Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The React admin screens render a "has not been built" notice when their
    # bundle is missing, and the integration suite asserts they mount. Same
    # reason as the php job: dist/ is gitignored and a bare checkout has none.
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: pnpm env:start
      - run: pnpm ci:php:wp

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [structure, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:build
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: pnpm test:e2e:install
      - run: pnpm env:start
      - run: pnpm ci:e2e
      - name: Upload browser diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            .playwright-results/
            test-results/
          retention-days: 7

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [release-plan, security, structure, i18n, frontend, php, coverage, wordpress, build, e2e]
    if: >-
      always() &&
      (needs.release-plan.result == 'success' || needs.release-plan.result == 'skipped') &&
      needs.security.result == 'success' &&
      needs.structure.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.php.result == 'success' &&
      needs.coverage.result == 'success' &&
      needs.wordpress.result == 'success' &&
      needs.build.result == 'success' &&
      needs.e2e.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Build reproducible verified package
        env:
          AGGR_RELEASE_VERSION: ${{ needs.release-plan.outputs.next_version }}
        run: pnpm ci:package
      - name: Upload verified plugin package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-package
          path: |
            release/*.zip
            release/*.zip.sha256
          retention-days: 30

  # semantic-release creates the tag and a private draft from the package that
  # passed every CI lane. The version lives in the tag and is stamped into the
  # staged tree by package.sh, so nothing is written back to master and this
  # runs on the same push that merged the change. The reconciler verifies remote
  # bytes and provenance before making that draft visible to the updater.
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [release-plan, package]
    if: >-
      success() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master' &&
      needs.release-plan.outputs.should_release == 'true'
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # zizmor: ignore[artipacked] semantic-release needs this credential
          # only in the publishing job so it can push the verified release tag.
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Download accepted plugin package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-package
          path: release/
      - name: Create semantic release draft
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        run: pnpm semantic-release
      - name: Attest build provenance
        if: ${{ !cancelled() && hashFiles('release/aggressive-ads-*.zip') != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/aggressive-ads-*.zip
      - name: Reconcile and publish verified draft
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGGR_RELEASE_VERSION: ${{ needs.release-plan.outputs.next_version }}
        run: bash bin/release/publish.sh

  summary:
    name: CI Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: always()
    needs: [release-plan, security, structure, i18n, frontend, php, coverage, wordpress, build, e2e, package, release]
    env:
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REF: ${{ github.ref }}
      SHOULD_RELEASE: ${{ needs.release-plan.outputs.should_release }}
      RELEASE_PLAN: ${{ needs.release-plan.result }}
      SECURITY: ${{ needs.security.result }}
      STRUCTURE: ${{ needs.structure.result }}
      I18N: ${{ needs.i18n.result }}
      FRONTEND: ${{ needs.frontend.result }}
      PHP: ${{ needs.php.result }}
      COVERAGE: ${{ needs.coverage.result }}
      WORDPRESS: ${{ needs.wordpress.result }}
      BUILD: ${{ needs.build.result }}
      E2E: ${{ needs.e2e.result }}
      PACKAGE: ${{ needs.package.result }}
      RELEASE: ${{ needs.release.result }}
    steps:
      - name: Require every quality and artifact lane
        run: |
          set -euo pipefail
          failed=0
          for lane in SECURITY STRUCTURE I18N FRONTEND PHP COVERAGE WORDPRESS BUILD E2E PACKAGE; do
            result="${!lane}"
            printf '%-12s %s\n' "${lane}" "${result}"
            if [[ "${result}" != "success" ]]; then
              failed=1
            fi
          done

          if [[ ( "${EVENT_NAME}" == "push" || "${EVENT_NAME}" == "workflow_dispatch" ) &&
                "${EVENT_REF}" == "refs/heads/master" ]]; then
            [[ "${RELEASE_PLAN}" == "success" ]] || failed=1
          else
            [[ "${RELEASE_PLAN}" == "skipped" ]] || failed=1
          fi

          # One decision now, where there used to be two: a release-worthy push
          # publishes on that same run. Nothing is written back to master, so
          # there is no second pass to wait for.
          if [[ "${SHOULD_RELEASE}" == "true" ]]; then
            [[ "${RELEASE}" == "success" ]] || failed=1
          else
            [[ "${RELEASE}" == "skipped" ]] || failed=1
          fi

          printf '%-12s %s\n' RELEASE_PLAN "${RELEASE_PLAN}"
          printf '%-12s %s\n' RELEASE "${RELEASE}"
          exit "${failed}"
