# The contract: every job here runs a `pnpm ci:*` script **verbatim**, the same
# script a developer runs locally. Green locally means green here.
#
# The temptation is to decompose a lane into its steps for prettier parallelism
# — a separate job for phpcs, another for phpstan. Don't: the moment CI runs
# something the developer cannot run in one command, "it passed on my machine"
# becomes a permanent state of affairs, and that is the failure this whole
# arrangement exists to prevent.
#
# Adding a lane means adding it to BOTH this file and bin/ci/verify.sh.
#
# Actions are pinned to commit SHAs, not tags. A tag is a moving pointer the
# action's owner can repoint at any time, which makes every third-party action
# a standing code-execution grant nobody re-approved.
# bin/ci/check-action-pins.sh fails the build on an unpinned one.
#
# pnpm/action-setup must not set `version` when package.json has packageManager.
# The action treats that as two pins and fails every job before anything runs.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: 'ci:security'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:doctor
      - run: pnpm ci:security

  structure:
    name: 'ci:doctor + lint:files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs first everywhere: a toolchain mismatch fails in two seconds rather
      # than as a confusing error twenty minutes in.
      - run: pnpm ci:doctor

      - run: pnpm lint:files

  build:
    name: 'ci:build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:doctor
      - run: pnpm ci:build

      - name: Keep compiled assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 3

  frontend:
    name: 'ci:frontend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:doctor
      - run: pnpm ci:frontend

  php:
    name: 'ci:php'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile

      # PHPCS (WordPress + full VIP-Go), PHPStan level 8, and the unit suite.
      - run: pnpm ci:php

  coverage:
    name: 'ci:coverage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:coverage

  wordpress:
    name: 'ci:php:wp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile

      # wp-env brings its own WordPress and MySQL. These suites need a real
      # capability pipeline, real dbDelta and a real WP_REST_Server — none of
      # which is expressible against mocks, which is why PHPUnit is pinned to
      # 9.6. See docs/testing-strategy.md.
      - run: pnpm env:start

      - run: pnpm ci:php:wp

      - name: Debug log on failure
        if: failure()
        run: pnpm cli sh -c "tail -n 200 /var/www/html/wp-content/debug.log" || true

  e2e:
    name: 'ci:e2e'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm env:start
      # ci:e2e runs pnpm build before Playwright so dist/ is present.
      - run: pnpm ci:e2e

      - name: Debug log on failure
        if: failure()
        run: pnpm cli sh -c "tail -n 200 /var/www/html/wp-content/debug.log" || true

      - name: Keep browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  package:
    name: 'ci:package'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ci:package builds dist/, then the ZIP, then verifies the ZIP — not the
      # staging directory it was built from. The staging directory is what the
      # packaging script believes it produced; the archive is what a site owner
      # installs.
      - run: pnpm ci:package

      - name: Keep the archive for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-package
          path: release/*.zip
          retention-days: 7
