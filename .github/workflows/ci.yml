# Canonical CI/CD quality pipeline. Every executable lane maps to a committed
# package.json ci:* command and bin/ci/verify.sh mirrors the same contract.
name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Cut a release from everything merged since the last tag'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.18.1'
  PHP_VERSION: '8.4'

jobs:
  # semantic-release verifies push permission even in dry-run mode. Keep that
  # write-capable token isolated from build and test jobs, and plan only from a
  # trusted push to master.
  release-plan:
    name: Plan Release
    runs-on: ubuntu-24.04
    # Publishing is asked for, never a side effect of merging.
    #
    # Fourteen releases in eighteen days on the sibling theme, three of them in
    # one day; each is an update event on a live site. Here, four shipped in a
    # single afternoon. Merging now runs the quality pipeline and stops, and
    # everything merged since the last tag ships together when somebody runs:
    #
    #   gh workflow run "CI/CD Pipeline" --ref master -f publish=true
    #
    # It also removes a failure seen today: a push run cancelled mid-flight took
    # Release down with it, so v1.2.1 never published and nothing said why. A
    # push that cannot publish cannot interrupt a release. Running this when
    # nothing is pending is harmless — planning reports no release and stops.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish &&
      github.ref == 'refs/heads/master'
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      release_type: ${{ steps.check.outputs.release_type }}
      next_version: ${{ steps.check.outputs.next_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Lifecycle scripts are not needed for release analysis and must not run
      # while this job holds its scoped write token.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Determine release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        run: node bin/release/plan.mjs

  # ============================================================================
  # Is this the machine-written version sync?
  #
  # That pull request rewrites six version strings and a POT header and nothing
  # else, yet it was pulling the browser suite, the WordPress suite and a
  # package build behind it — roughly seven minutes of runner time to confirm
  # that a version string is still a version string, once per release.
  #
  # Identified by branch *and* author together. Either alone is weak: a fork can
  # name a branch anything, and the App could in principle open something else.
  # Both must hold, and the lanes that still run — repository contracts, PHP,
  # frontend, security, CodeQL — are the ones that would actually notice if this
  # pull request contained something other than what it claims.
  # ============================================================================
  gate:
    name: Classify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version_sync: ${{ steps.classify.outputs.version_sync }}
      prose_only: ${{ steps.classify.outputs.prose_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${HEAD_REF}" == "chore/version-sync" && "${AUTHOR}" == "aggressive-ci[bot]" ]]; then
            echo "version_sync=true" >> "${GITHUB_OUTPUT}"
            echo "Machine version sync: the browser, WordPress and package lanes are skipped."
          else
            echo "version_sync=false" >> "${GITHUB_OUTPUT}"
          fi

          # Asks whether anything that is *not* Markdown changed, rather than
          # whether anything Markdown did. The difference matters: an
          # unrecognised new file type counts as code under this reading and
          # would be silently classified as prose under the other.
          #
          # workflow_dispatch has no diff to read and answers for itself — a
          # manual run wants every lane. A workflow edit is code by this
          # definition, which is correct: a change to the pipeline must be
          # exercised by the pipeline.
          prose_only=false

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            changed="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"

            if [[ -n "${changed}" ]] && ! grep -qvE '\.md$' <<< "${changed}"; then
              prose_only=true
            fi
          fi

          echo "prose_only=${prose_only}" >> "${GITHUB_OUTPUT}"

          if [[ "${prose_only}" == "true" ]]; then
            echo "Markdown only: the lanes that cannot read prose are skipped."
          fi

  security:
    name: Security
    needs: [gate]
    if: needs.gate.outputs.version_sync != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:doctor
      - run: pnpm ci:security

  structure:
    name: Repository Contracts
    needs: [gate]
    if: needs.gate.outputs.version_sync != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:doctor
      - run: pnpm composer:verify
      - run: pnpm lint:files

  i18n:
    name: Translations
    needs: [gate]
    if: needs.gate.outputs.version_sync != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Installed explicitly rather than left to the runner image: catalog
      # validation must fail closed on a broken .po, and it can only do that
      # if msgfmt is present for a reason instead of by luck.
      - name: Install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext
      - run: pnpm ci:i18n

  frontend:
    name: Frontend Quality
    needs: [gate]
    if: needs.gate.outputs.version_sync != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:doctor
      - run: pnpm ci:frontend

  php:
    name: PHP Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # dist/ is gitignored, so a bare checkout has no bundles — and PHPStan
    # resolves the `require dist/admin/*.asset.php` each admin screen performs.
    # Without them it reports five require.fileNotFound errors that no local run
    # can reproduce, because a working copy always has a build in it.
    needs: [build, gate]
    if: needs.gate.outputs.version_sync != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: pnpm ci:php

  coverage:
    name: PHP Coverage
    needs: [gate]
    if: needs.gate.outputs.version_sync != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          tools: composer:v2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:coverage

  wordpress:
    name: WordPress Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The React admin screens render a "has not been built" notice when their
    # bundle is missing, and the integration suite asserts they mount. Same
    # reason as the php job: dist/ is gitignored and a bare checkout has none.
    needs: [build, gate]
    if: needs.gate.outputs.version_sync != 'true' && needs.gate.outputs.prose_only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: pnpm env:start
      - run: pnpm ci:php:wp

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [structure, frontend, gate]
    if: needs.gate.outputs.version_sync != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:build
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build, gate]
    if: needs.gate.outputs.version_sync != 'true' && needs.gate.outputs.prose_only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # A slow apt is waited out, never killed.
      #
      # An earlier version capped each attempt at five minutes and retried.
      # `timeout` kills the command it is given rather than the process group
      # beneath it, so it killed playwright while the apt-get it had spawned as
      # root kept running and kept /var/lib/apt/lists/lock. Both remaining
      # attempts died in seconds with "Could not get lock". The retry did not
      # merely fail to help — it guaranteed failure, on a first attempt that may
      # well have finished given another minute.
      #
      # So the step bound is the only limit, and the retry is there for a
      # genuine apt failure rather than for slowness. Slowness is not failure.
      #
      # Pull requests do not pay this at all: they install Chromium in about
      # twenty seconds. This path is master's, where WebKit's multimedia stack —
      # gstreamer, libavfilter and the rest — is the whole cost.
      #
      # The browser cache hits either way — 305 MB restored in about five
      # seconds — so this time is entirely apt, and it is real work: without
      # --with-deps the browsers cannot launch.
      #
      # The step bound clears three attempts with room to spare, so the retry
      # gets to report rather than being cut off mid-recovery.
      # Pull requests install Chromium only. WebKit's dependencies are the
      # GStreamer multimedia stack, which is what was still downloading when
      # this step timed out; Chromium needs a fraction of it. master and any
      # publishing run install both and exercise Safari.
      - run: pnpm test:e2e:install:chromium
        if: github.event_name == 'pull_request'
        timeout-minutes: 18
      - run: pnpm test:e2e:install
        if: github.event_name != 'pull_request'
        timeout-minutes: 18
      - run: pnpm env:start
      - run: pnpm ci:e2e
        env:
          AGGR_E2E_SKIP_WEBKIT: ${{ github.event_name == 'pull_request' }}
      - name: Upload browser diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            .playwright-results/
            test-results/
          retention-days: 7

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [release-plan, security, structure, i18n, frontend, php, coverage, wordpress, build, e2e, gate]
    if: >-
      always() &&
      needs.gate.outputs.version_sync != 'true' &&
      needs.gate.outputs.prose_only != 'true' &&
      (needs.release-plan.result == 'success' || needs.release-plan.result == 'skipped') &&
      needs.security.result == 'success' &&
      needs.structure.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.php.result == 'success' &&
      needs.coverage.result == 'success' &&
      needs.wordpress.result == 'success' &&
      needs.build.result == 'success' &&
      needs.e2e.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Build reproducible verified package
        env:
          AGGR_RELEASE_VERSION: ${{ needs.release-plan.outputs.next_version }}
        run: pnpm ci:package
      - name: Upload verified plugin package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-package
          path: |
            release/*.zip
            release/*.zip.sha256
          retention-days: 30

  # ============================================================================
  # Post-release: put the published version back into the repository.
  #
  # package.sh stamps the version into the archive and deliberately leaves the
  # checkout untouched, so without this master drifts further from every release.
  # WordPress reads the plugin header as the authoritative version and
  # AGGR_VERSION is a cache key, so that drift is functional, not cosmetic.
  #
  # This opens a pull request rather than pushing. master requires signed
  # commits, reviewed pull requests and passing checks, and restoring a bypass
  # to commit a version header would trade a real security property for a
  # convenience. The bump goes through the same gates as any other change.
  #
  # Its own job, so the publishing job holds its write token for the minimum
  # time. Enforcement is this job itself: CI Summary requires it to have
  # succeeded whenever a release was planned, so a sync that fails to open fails
  # loudly on the run somebody is already watching.
  #
  # The pull request merges itself and skips every lane. It rewrites version
  # strings and a catalog header, so no lane can say anything about it — but the
  # workflows still trigger, because a workflow that never runs leaves its
  # required check pending forever and would strand the very pull request this
  # speeds up.
  # ============================================================================
  version-sync:
    name: Sync Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [release-plan, release]
    if: >-
      success() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish &&
      github.ref == 'refs/heads/master' &&
      needs.release-plan.outputs.should_release == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The POT embeds the version in Project-Id-Version, so it moves with the
      # header or the next push fails the i18n lane on a catalog nobody touched.
      - run: bash bin/ci/install-wp-cli.sh
      - name: Write the published version into the checkout
        run: node bin/release/sync-version.mjs "${{ needs.release-plan.outputs.next_version }}"
      # A credential that is not GITHUB_TOKEN is what lets this pull request
      # start its own checks; master requires them, and GitHub does not trigger
      # workflows for its own token. Without the App the pull request still
      # opens, and the guard keeps failing until somebody moves it along.
      - name: Mint a release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AA_CI_CLIENT_ID }}
          private-key: ${{ secrets.AA_CI_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the version sync pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Commits through the API rather than with git, so GitHub signs them.
          # master refuses an unsigned commit, and an unsigned sync pull request
          # would pass every check and be refused only at the merge.
          sign-commits: true
          add-paths: |
            aggressive-ads.php
            src/blocks/placement/block.json
            README.md
            tests/php/bootstrap-unit.php
            tests/php/phpstan-bootstrap.php
            languages/aggressive-ads.pot
          branch: chore/version-sync
          delete-branch: true
          commit-message: |
            chore(release): sync version to ${{ needs.release-plan.outputs.next_version }}

            Writes the published version into the declarations WordPress reads
            and regenerates the POT, whose Project-Id-Version embeds it.
          title: 'chore(release): sync version to ${{ needs.release-plan.outputs.next_version }}'
          body: |
            Automated follow-up to **v${{ needs.release-plan.outputs.next_version }}**.

            `bin/release/package.sh` stamps the version into the distributable
            archive and leaves the checkout untouched, so this restores the
            tracked declarations to the published version and regenerates
            `languages/aggressive-ads.pot` alongside them — the catalog embeds
            the version in `Project-Id-Version`, so the two must move together.

            `package.json` stays on `0.0.0-development` by design.

            Reproduce locally with:

            ```bash
            pnpm version:sync
            ```
      # Merges itself once its checks pass. The content is machine-written from
      # the tag and re-derivable with one command, so a human clicking merge
      # reviews nothing and only delays the repository agreeing with its own
      # release. Auto-merge waits for the required checks either way, so the
      # protection on master is unchanged — this removes a wait, not a gate.
      - name: Let it merge once its checks pass
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          number="$(gh pr list --head chore/version-sync --state open \
            --json number --jq '.[0].number // empty')"

          if [[ -z "${number}" ]]; then
            echo "No sync pull request was opened, so there is nothing to merge."
            exit 0
          fi

          gh pr merge "${number}" --auto --squash --delete-branch
          echo "Version sync #${number} will merge when its checks pass."

  # semantic-release creates the tag and a private draft from the package that
  # passed every CI lane. The version lives in the tag and is stamped into the
  # staged tree by package.sh, so nothing is written back to master and this
  # runs on the same push that merged the change. The reconciler verifies remote
  # bytes and provenance before making that draft visible to the updater.
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [release-plan, package]
    if: >-
      success() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish &&
      github.ref == 'refs/heads/master' &&
      needs.release-plan.outputs.should_release == 'true'
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # zizmor: ignore[artipacked] semantic-release needs this credential
          # only in the publishing job so it can push the verified release tag.
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Download accepted plugin package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-package
          path: release/
      - name: Create semantic release draft
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        run: pnpm semantic-release
      - name: Attest build provenance
        if: ${{ !cancelled() && hashFiles('release/aggressive-ads-*.zip') != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/aggressive-ads-*.zip
      - name: Reconcile and publish verified draft
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGGR_RELEASE_VERSION: ${{ needs.release-plan.outputs.next_version }}
        run: bash bin/release/publish.sh

  summary:
    name: CI Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: always()
    needs: [release-plan, security, structure, i18n, frontend, php, coverage, wordpress, build, e2e, package, release, version-sync, gate]
    env:
      EVENT_NAME: ${{ github.event_name }}
      PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
      EVENT_REF: ${{ github.ref }}
      SHOULD_RELEASE: ${{ needs.release-plan.outputs.should_release }}
      RELEASE_PLAN: ${{ needs.release-plan.result }}
      SECURITY: ${{ needs.security.result }}
      STRUCTURE: ${{ needs.structure.result }}
      I18N: ${{ needs.i18n.result }}
      FRONTEND: ${{ needs.frontend.result }}
      PHP: ${{ needs.php.result }}
      COVERAGE: ${{ needs.coverage.result }}
      WORDPRESS: ${{ needs.wordpress.result }}
      BUILD: ${{ needs.build.result }}
      E2E: ${{ needs.e2e.result }}
      PACKAGE: ${{ needs.package.result }}
      RELEASE: ${{ needs.release.result }}
      VERSION_SYNC: ${{ needs.version-sync.result }}
      SYNC_ONLY: ${{ needs.gate.outputs.version_sync }}
      PROSE_ONLY: ${{ needs.gate.outputs.prose_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Require every quality and artifact lane
        run: node bin/ci/check-summary.mjs
