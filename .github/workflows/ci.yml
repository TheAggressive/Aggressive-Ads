# The contract: every job here runs a `pnpm ci:*` script **verbatim**, the same
# script a developer runs locally. Green locally means green here.
#
# The temptation is to decompose a lane into its steps for prettier parallelism
# — a separate job for phpcs, another for phpstan. Don't: the moment CI runs
# something the developer cannot run in one command, "it passed on my machine"
# becomes a permanent state of affairs, and that is the failure this whole
# arrangement exists to prevent.
#
# Adding a lane means adding it to BOTH this file and bin/ci/verify.sh.
#
# Actions are pinned to commit SHAs, not tags. A tag is a moving pointer the
# action's owner can repoint at any time, which makes every third-party action
# a standing code-execution grant nobody re-approved.
# bin/ci/check-action-pins.sh fails the build on an unpinned one.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structure:
    name: 'ci:doctor + lint:files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.34.1
        with:
          php-version: '8.4'
          coverage: none

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs first everywhere: a toolchain mismatch fails in two seconds rather
      # than as a confusing error twenty minutes in.
      - run: pnpm ci:doctor

      - run: pnpm lint:files

  php:
    name: 'ci:php'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.34.1
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Cache Composer
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile

      # PHPCS (WordPress + full VIP-Go), PHPStan level 8, and the unit suite.
      - run: pnpm ci:php

  wordpress:
    name: 'ci:php:wp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.34.1
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: pnpm

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile

      # wp-env brings its own WordPress and MySQL. These suites need a real
      # capability pipeline, real dbDelta and a real WP_REST_Server — none of
      # which is expressible against mocks, which is why PHPUnit is pinned to
      # 9.6. See docs/adr/0013-phpunit-9-with-wp-test-suite.md.
      - run: pnpm env:start

      - run: pnpm ci:php:wp

      - name: Debug log on failure
        if: failure()
        run: pnpm cli sh -c "tail -n 200 /var/www/html/wp-content/debug.log" || true
