name: 🌐 i18n MT drafts

# Machine-translates empty and fuzzy catalog entries and opens a pull request.
#
# It never pushes to a protected branch, and it is never part of `build` or
# `release`. Unreviewed machine output must not reach a site: the review gate is
# the pull request, and it is the point of the whole workflow.
#
# No third-party pull-request action. `gh` is preinstalled on the runner, and
# adding a marketplace action here would mean one more pinned SHA to keep
# current for a job that runs `gh pr create` once.

on:
  push:
    branches: [master]
    paths:
      - 'languages/*.pot'
  workflow_dispatch:
    inputs:
      locale:
        description: 'Single locale (e.g. fr_FR). Blank does every catalog.'
        required: false
        type: string

# The default token is read-only; this job needs to push a branch and open a PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: i18n-translate
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  I18N_DRAFT_BRANCH: 'i18n/mt-drafts'

jobs:
  draft:
    name: Draft translations
    runs-on: ubuntu-24.04
    # Measured, not guessed. The first run that got far enough to translate
    # anything did de_DE in 10m46s and es_ES in 10m51s — 1014 entries each,
    # through DeepL — and was cut off partway through the third locale by a
    # 30-minute ceiling. Four locales need roughly 43 minutes of translation
    # plus a couple for setup and msgmerge.
    #
    # That full pass is a first-run cost: the catalogs were empty, so every
    # entry was new. Later runs only touch what the POT actually changed, which
    # is usually a handful. The ceiling is sized for the bootstrap because a job
    # that can never finish its first run can never produce a second.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Installed explicitly rather than left to the runner image, for the same
      # reason ci.yml does it: this job cannot work without it. Drafting runs
      # `sync.sh` first, which merges the new POT into every catalog with
      # `msgmerge`, and validation then reads them with `msgfmt`. Neither is on
      # ubuntu-24.04 by default, so the job died on the first line of real work
      # — before it had translated anything, and long before the commit it is
      # named for.
      - name: Install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      # No-op rather than fail when no locale exists yet: this workflow fires on
      # every POT change, and a repository with no catalogs is a normal state.
      - id: catalogs
        run: |
          if ls languages/*.po > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No locale .po files. Scaffold one with: pnpm i18n:locale -- fr_FR"
          fi

      # A provider-limited run can have hundreds of valid translations in its
      # worktree when it exits non-zero. Those used to disappear with the
      # runner, so every retry began from master and paid for the same strings
      # again. Resume from the draft branch, but never copy a whole stale PO
      # over master: the helper only fills entries that master still considers
      # empty/fuzzy, and only from entries explicitly tagged `aggr-mt`.
      - name: Restore saved draft progress
        if: steps.catalogs.outputs.present == 'true'
        env:
          DRAFT_BRANCH: ${{ env.I18N_DRAFT_BRANCH }}
        run: |
          set -euo pipefail

          set +e
          git ls-remote --exit-code --heads origin "${DRAFT_BRANCH}" > /dev/null 2>/tmp/i18n-ls-remote.err
          status=$?
          set -e

          if [ "${status}" -eq 2 ]; then
            echo "No saved draft branch yet; starting from master catalogs."
            exit 0
          fi

          if [ "${status}" -ne 0 ]; then
            cat /tmp/i18n-ls-remote.err >&2
            exit "${status}"
          fi

          git fetch --quiet --depth=1 origin "${DRAFT_BRANCH}:refs/remotes/origin/${DRAFT_BRANCH}"
          draft_ref="refs/remotes/origin/${DRAFT_BRANCH}"
          restored=0

          for file in languages/*.po; do
            if ! git cat-file -e "${draft_ref}:${file}" 2>/dev/null; then
              continue
            fi

            saved="${RUNNER_TEMP}/$(basename "${file}").saved"
            git show "${draft_ref}:${file}" > "${saved}"
            output="$(node bin/i18n/resume-progress.mjs "${file}" "${saved}")"
            echo "${output}"
            count="${output##*=}"
            restored=$(( restored + count ))
          done

          echo "Restored ${restored} saved machine translation(s)."

      # The translator intentionally exits non-zero when quota/rate limits stop
      # it before every locale is complete. Let the job continue long enough to
      # validate and persist what it already wrote; a final step turns the job
      # red again afterwards so an incomplete run is never presented as done.
      - id: translate
        name: Machine-translate empty and fuzzy entries
        if: steps.catalogs.outputs.present == 'true'
        continue-on-error: true
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
          I18N_MT_EMAIL: ${{ secrets.I18N_MT_EMAIL }}
          # Through the environment, never interpolated into the script body: a
          # workflow_dispatch input expanded inline is a shell injection anyone
          # who can start the workflow controls.
          INPUT_LOCALE: ${{ inputs.locale }}
        run: |
          if [ -n "${INPUT_LOCALE}" ]; then
            pnpm i18n:translate -- --locale="${INPUT_LOCALE}"
          else
            pnpm i18n:translate
          fi

      # The same gate CI runs. Machine output that drops a placeholder must fail
      # here rather than arrive in a pull request looking reviewed. Because the
      # translation step is continue-on-error, provider-limited partial output
      # still reaches this safety gate before anything is persisted.
      - name: Validate the catalogs
        if: steps.catalogs.outputs.present == 'true'
        run: node bin/i18n/lint-placeholders.mjs

      # HUSKY=0 for the same reason ci.yml sets it around its own git writes:
      # the repository installs git hooks for people, and this job is not one.
      # Without it `git push` runs .husky/pre-push, which runs `pnpm qa:fast`,
      # which runs doctor.mjs — and doctor fails a runner whose PHP and Node
      # differ from the pinned CI versions. That is a correct thing to tell a
      # developer and a nonsense thing to tell a job that is already inside CI.
      #
      # Partial, validated progress is pushed too. The next run restores it and
      # continues from the first still-empty/fuzzy entry instead of starting over.
      - name: Open or update the draft pull request
        if: steps.catalogs.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
          DRAFT_BRANCH: ${{ env.I18N_DRAFT_BRANCH }}
        run: |
          set -euo pipefail

          if git diff --quiet -- languages; then
            echo "No catalog changes to propose."
            exit 0
          fi

          branch="${DRAFT_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Refetch immediately before the lease. Restore may have fetched this
          # branch many minutes ago, and a lease that protects stale information
          # is not a lease at all.
          git remote set-branches --add origin "${branch}"
          git fetch --quiet origin "${branch}" || true
          remote_head="$(git rev-parse --verify --quiet "refs/remotes/origin/${branch}" || echo '')"

          # A retry that hit the provider limit before adding anything new can
          # still contain the already-saved draft after restore. Do not rewrite
          # the branch with an identical catalog tree just to produce a new
          # timestamped commit; simply ensure its PR exists below.
          needs_push=true
          if [ -n "${remote_head}" ] && git diff --quiet "${remote_head}" -- languages; then
            needs_push=false
            echo "No new catalog progress since the saved draft."
          fi

          if [ "${needs_push}" = true ]; then
            git checkout -B "${branch}"
            git add languages
            # chore(i18n) on purpose: semantic-release must not cut a version for
            # a translation draft. Merged catalogs ride the next feat/fix release.
            git commit -m "chore(i18n): machine-translated draft catalogs"

            git push --force-with-lease="${branch}:${remote_head}" origin "${branch}"
          fi

          if [ -z "$(gh pr list --head "${branch}" --state open --json number --jq '.[].number')" ]; then
            cat > /tmp/pr-body.md <<'BODY'
          Machine translation filled empty and fuzzy entries. Every filled entry is
          flagged `aggr-mt` and carries a review comment naming the provider.

          **Skim before merging.** Machine output is a draft: check placeholders,
          product names, and the register of short UI labels. Provider quota or
          rate limits can leave this PR partially filled; later runs restore this
          branch and continue from the entries that are still empty/fuzzy.

          Compiled catalogs are not committed. The release job builds them from
          whatever `.po` is on `master`, so merged translations ride the next
          feat/fix release without a version bump of their own.
          BODY
            sed -i 's/^          //' /tmp/pr-body.md

            gh pr create \
              --head "${branch}" \
              --base master \
              --title "chore(i18n): machine-translated draft catalogs" \
              --body-file /tmp/pr-body.md
          else
            echo "Pull request already open for ${branch}."
          fi

      # Keep the original completeness signal. The difference is that by the
      # time this fails, validated partial work has already been saved and the
      # next run can actually resume it.
      - name: Report incomplete translation run
        if: steps.catalogs.outputs.present == 'true' && steps.translate.outcome == 'failure'
        run: |
          echo "::error::Machine translation did not finish. Validated partial progress was saved to ${I18N_DRAFT_BRANCH}; re-run when provider quota allows and it will resume from that draft."
          exit 1
